
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova AI</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --bg:#090c13;
  --panel:#10151f;
  --panel2:#171e2b;
  --text:#f4f7ff;
  --muted:#8994a9;
  --accent:#01c7fc;
  --purple:#9864ff;
  --border:rgba(255,255,255,.09);
}

* {box-sizing:border-box}

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
  height:100dvh;
  overflow:hidden;
}

button,input,textarea {font:inherit}

button {cursor:pointer;color:inherit}

.app {
  height:100dvh;
  display:flex;
}

/* SIDEBAR */

.sidebar {
  width:260px;
  background:#0d111a;
  border-right:1px solid var(--border);
  padding:22px 15px;
  display:flex;
  flex-direction:column;
  transition:.3s;
  z-index:5;
}

.brand {
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:800;
  font-size:20px;
  margin:5px 7px 30px;
}

.logo {
  width:37px;
  height:37px;
  border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--purple));
  display:grid;
  place-items:center;
  box-shadow:0 0 25px #01c7fc44;
}

.logo svg {width:23px}

.new-chat {
  background:linear-gradient(110deg,#01aee8,#7955f5);
  border:0;
  border-radius:13px;
  padding:14px;
  font-weight:700;
  transition:.2s;
}

.new-chat:hover {transform:translateY(-2px);filter:brightness(1.15)}

.section-label {
  font-size:11px;
  color:var(--muted);
  letter-spacing:2px;
  margin:30px 8px 12px;
}

.history {
  flex:1;
  overflow:auto;
}

.history-item {
  padding:12px;
  border-radius:10px;
  font-size:13px;
  color:#b7c0d1;
  cursor:pointer;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.history-item:hover,.history-item.active {
  background:var(--panel2);
  color:white;
}

.sidebar-bottom {
  border-top:1px solid var(--border);
  padding-top:17px;
  color:var(--muted);
  font-size:12px;
}

/* MAIN */

.main {
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  position:relative;
}

.topbar {
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  border-bottom:1px solid var(--border);
  background:#090c13dd;
  backdrop-filter:blur(15px);
  z-index:2;
}

.model {
  background:var(--panel2);
  border:1px solid var(--border);
  padding:9px 13px;
  border-radius:10px;
  font-size:12px;
  color:#c4d0e2;
}

.status {
  font-size:12px;
  color:#72dca5;
  display:flex;
  align-items:center;
  gap:8px;
}

.dot {
  width:7px;
  height:7px;
  border-radius:50%;
  background:#4ee49b;
  box-shadow:0 0 12px #4ee49b;
}

.menu-btn {
  display:none;
  border:0;
  background:none;
  font-size:22px;
}

/* CHAT */

.chat {
  flex:1;
  overflow-y:auto;
  scroll-behavior:smooth;
  padding:35px 20px 180px;
}

.chat-inner {
  max-width:850px;
  margin:auto;
}

.welcome {
  min-height:65vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  animation:enter .8s ease both;
}

@keyframes enter {
  from {opacity:0;transform:translateY(25px)}
  to {opacity:1;transform:translateY(0)}
}

.welcome-logo {
  width:75px;
  height:75px;
  border-radius:24px;
  display:grid;
  place-items:center;
  font-size:38px;
  background:linear-gradient(135deg,#01c7fc33,#9864ff44);
  border:1px solid #01c7fc55;
  box-shadow:0 0 65px #01c7fc22;
  margin-bottom:28px;
  animation:float 4s infinite ease-in-out;
}

@keyframes float {
  50% {transform:translateY(-10px) rotate(4deg)}
}

.welcome h1 {
  font-size:clamp(30px,5vw,48px);
  margin:0;
  letter-spacing:-2px;
}

.gradient {
  background:linear-gradient(90deg,#01c7fc,#9d70ff,#ff72c7);
  background-clip:text;
  -webkit-background-clip:text;
  color:transparent;
}

.welcome p {
  color:var(--muted);
  font-size:14px;
  margin:15px 0 30px;
}

.suggestions {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  width:min(100%,560px);
}

.suggestion {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  padding:16px;
  text-align:left;
  font-size:12px;
  color:#c5d0e2;
  transition:.2s;
}

.suggestion:hover {
  border-color:#01c7fc88;
  background:#151d2b;
  transform:translateY(-3px);
}

/* MESSAGES */

.message {
  display:flex;
  gap:14px;
  margin:30px 0;
  animation:messageIn .4s ease both;
}

@keyframes messageIn {
  from {opacity:0;transform:translateY(15px)}
  to {opacity:1;transform:translateY(0)}
}

.avatar {
  width:34px;
  height:34px;
  min-width:34px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:var(--panel2);
  font-size:16px;
}

.message.user .avatar {
  background:#1b3350;
}

.message-body {
  flex:1;
  min-width:0;
  line-height:1.75;
  font-size:14px;
  overflow-wrap:anywhere;
}

.message-name {
  font-size:12px;
  font-weight:700;
  margin-bottom:8px;
  color:#b5c1d4;
}

.message-text {
  color:#e1e7f1;
  white-space:pre-wrap;
}

.message-text pre {
  background:#080c14;
  border:1px solid var(--border);
  border-radius:12px;
  padding:17px;
  overflow-x:auto;
  white-space:pre;
  font-size:12px;
}

.message-text code {
  font-family:monospace;
  color:#80dcff;
}

.message-text p {margin:8px 0}

.message-actions {
  margin-top:12px;
}

.message-actions button {
  background:none;
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--muted);
  padding:6px 10px;
  font-size:11px;
}

.message-actions button:hover {color:white}

.typing {
  display:flex;
  gap:5px;
  padding:10px 0;
}

.typing span {
  width:7px;height:7px;
  border-radius:50%;
  background:var(--accent);
  animation:bounce .8s infinite alternate;
}

.typing span:nth-child(2) {animation-delay:.2s}
.typing span:nth-child(3) {animation-delay:.4s}

@keyframes bounce {
  to {transform:translateY(-7px);opacity:.3}
}

/* COMPOSER */

.composer-area {
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:25px 20px 18px;
  background:linear-gradient(transparent,#090c13 25%);
}

.composer {
  max-width:850px;
  margin:auto;
  border:1px solid #ffffff22;
  background:#141a27;
  border-radius:20px;
  padding:12px 14px;
  box-shadow:0 10px 60px #0008;
  transition:.2s;
}

.composer:focus-within {
  border-color:#01c7fc88;
  box-shadow:0 0 35px #01c7fc15;
}

textarea {
  width:100%;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  min-height:45px;
  max-height:160px;
  padding:10px 5px;
  font-size:14px;
  line-height:1.6;
}

textarea::placeholder {color:#657187}

.composer-bottom {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:5px 3px 0;
}

.composer-info {
  font-size:11px;
  color:#657187;
}

.send {
  width:39px;
  height:39px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#01c7fc,#865cff);
  font-size:18px;
  transition:.2s;
}

.send:hover {transform:scale(1.1)}
.send:disabled {opacity:.4;cursor:not-allowed}

.disclaimer {
  text-align:center;
  color:#5f6b80;
  font-size:10px;
  margin-top:12px;
}

@media(max-width:700px) {
  .sidebar {
    position:absolute;
    top:0;bottom:0;left:0;
    transform:translateX(-100%);
    box-shadow:20px 0 60px #0008;
  }
  .sidebar.open {transform:translateX(0)}
  .menu-btn {display:block}
  .topbar {padding:0 15px}
  .chat {padding:20px 15px 160px}
  .suggestions {grid-template-columns:1fr}
  .welcome {min-height:60vh}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="logo">✦</div>
    NOVA AI
  </div>

  <button class="new-chat" onclick="newChat()">＋ New conversation</button>

  <div class="section-label">YOUR CONVERSATIONS</div>
  <div class="history" id="history"></div>

  <div class="sidebar-bottom">
    <div>✦ NOVA AI</div>
    <p>Independent AI experience</p>
    <p>Version 1.0.0 · 2026</p>
  </div>
</aside>

<main class="main">

<header class="topbar">
  <div style="display:flex;align-items:center;gap:14px">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <div class="model">✦ NOVA · AUTO</div>
  </div>

  <div class="status">
    <span class="dot"></span>
    <span id="status">Ready</span>
  </div>
</header>

<section class="chat" id="chat">
  <div class="chat-inner" id="messages">
    <div class="welcome" id="welcome">
      <div class="welcome-logo">✦</div>
      <h1>Meet your new <span class="gradient">AI.</span></h1>
      <p>Ideas, answers, creativity. All in one place.</p>

      <div class="suggestions">
        <button class="suggestion" onclick="suggest('Explain quantum physics simply.')">
          🧠 Explain something difficult
        </button>
        <button class="suggestion" onclick="suggest('Give me a creative website idea.')">
          💡 Generate creative ideas
        </button>
        <button class="suggestion" onclick="suggest('Help me write a JavaScript program.')">
          💻 Write some code
        </button>
        <button class="suggestion" onclick="suggest('Tell me an interesting fact.')">
          🌍 Discover something new
        </button>
      </div>
    </div>
  </div>
</section>

<div class="composer-area">
  <div class="composer">
    <textarea id="prompt" placeholder="Message Nova AI..." rows="1"></textarea>

    <div class="composer-bottom">
      <span class="composer-info">↵ Send · Shift + ↵ New line</span>
      <button class="send" id="send" onclick="sendMessage()">↑</button>
    </div>
  </div>
  <div class="disclaimer">
    AI can make mistakes. Check important information.
  </div>
</div>

</main>
</div>

<script>
const API = "https://api.llmfaucet.dev/v1/chat/completions";
const MODEL = "auto";

const promptBox = document.getElementById("prompt");
const messagesBox = document.getElementById("messages");
const chat = document.getElementById("chat");
const sendBtn = document.getElementById("send");
const statusText = document.getElementById("status");

let conversations = [];
let activeChat = null;
let busy = false;

function createId() {
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2);
}

function newChat() {
  activeChat = {
    id:createId(),
    title:"New conversation",
    messages:[]
  };

  conversations.unshift(activeChat);
  renderChat();
  renderHistory();
  promptBox.focus();
  closeSidebar();
}

function renderChat() {
  messagesBox.innerHTML = "";

  if (!activeChat || activeChat.messages.length === 0) {
    messagesBox.innerHTML = `
      <div class="welcome" id="welcome">
        <div class="welcome-logo">✦</div>
        <h1>Meet your new <span class="gradient">AI.</span></h1>
        <p>Ideas, answers, creativity. All in one place.</p>
        <div class="suggestions">
          <button class="suggestion" onclick="suggest('Explain quantum physics simply.')">🧠 Explain something difficult</button>
          <button class="suggestion" onclick="suggest('Give me a creative website idea.')">💡 Generate creative ideas</button>
          <button class="suggestion" onclick="suggest('Help me write a JavaScript program.')">💻 Write some code</button>
          <button class="suggestion" onclick="suggest('Tell me an interesting fact.')">🌍 Discover something new</button>
        </div>
      </div>`;
    return;
  }

  activeChat.messages.forEach(m => {
    addMessageElement(m.role,m.content,false);
  });

  scrollDown();
}

function renderHistory() {
  const history = document.getElementById("history");
  history.innerHTML = "";

  conversations.forEach(c => {
    const item = document.createElement("div");
    item.className = "history-item" +
      (activeChat && activeChat.id === c.id ? " active" : "");
    item.textContent = "◦ " + c.title;
    item.onclick = () => {
      activeChat = c;
      renderChat();
      renderHistory();
      closeSidebar();
    };
    history.appendChild(item);
  });
}

function addMessageElement(role,content,animate=true) {
  const el = document.createElement("div");
  el.className = "message " + role;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "◉" : "✦";

  const body = document.createElement("div");
  body.className = "message-body";

  const name = document.createElement("div");
  name.className = "message-name";
  name.textContent = role === "user" ? "You" : "Nova AI";

  const text = document.createElement("div");
  text.className = "message-text";
  text.textContent = content;

  body.append(name,text);

  if (role === "assistant") {
    const actions = document.createElement("div");
    actions.className = "message-actions";

    const copy = document.createElement("button");
    copy.textContent = "Copy response";
    copy.onclick = () => {
      navigator.clipboard.writeText(text.textContent)
        .then(() => copy.textContent = "Copied!");
    };

    actions.appendChild(copy);
    body.appendChild(actions);
  }

  el.append(avatar,body);
  messagesBox.appendChild(el);

  return text;
}

function showTyping() {
  const el = document.createElement("div");
  el.className = "message";
  el.id = "typing";

  el.innerHTML = `
    <div class="avatar">✦</div>
    <div class="message-body">
      <div class="message-name">Nova AI</div>
      <div class="typing">
        <span></span><span></span><span></span>
      </div>
    </div>`;

  messagesBox.appendChild(el);
  scrollDown();
}

function scrollDown() {
  requestAnimationFrame(() => {
    chat.scrollTop = chat.scrollHeight;
  });
}

function suggest(text) {
  promptBox.value = text;
  sendMessage();
}

function setBusy(value) {
  busy = value;
  sendBtn.disabled = value;
  sendBtn.textContent = value ? "…" : "↑";
  statusText.textContent = value ? "Thinking..." : "Ready";
}

async function sendMessage() {
  const content = promptBox.value.trim();

  if (!content || busy) return;

  if (!activeChat) newChat();

  const welcome = document.getElementById("welcome");
  if (welcome) welcome.remove();

  promptBox.value = "";
  promptBox.style.height = "45px";

  activeChat.messages.push({
    role:"user",
    content
  });

  if (activeChat.messages.length === 1) {
    activeChat.title = content.slice(0,35) +
      (content.length > 35 ? "..." : "");
  }

  addMessageElement("user",content);
  renderHistory();
  showTyping();

  setBusy(true);

  try {
    const response = await fetch(API,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer free"
      },
      body:JSON.stringify({
        model:MODEL,
        messages:[
          {
            role:"system",
            content:"You are Nova AI, a helpful, friendly and intelligent assistant. Give accurate, clear and useful answers. Format code in Markdown code blocks. Reply in the language used by the user."
          },
          ...activeChat.messages
        ],
        stream:true
      })
    });

    if (!response.ok) {
      throw new Error(
        response.status === 429
          ? "The free request allowance has been reached. Please try again later."
          : "AI service error (" + response.status + ")."
      );
    }

    document.getElementById("typing")?.remove();

    const output = addMessageElement("assistant","");
    let answer = "";

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const {done,value} = await reader.read();
      if (done) break;

      buffer += decoder.decode(value,{stream:true});

      const lines = buffer.split("\n");
      buffer = lines.pop() || "";

      for (const line of lines) {
        if (!line.startsWith("data:")) continue;

        const data = line.slice(5).trim();
        if (data === "[DONE]") continue;

        try {
          const json = JSON.parse(data);
          const token = json.choices?.[0]?.delta?.content || "";

          if (typeof token === "string") {
            answer += token;
            output.textContent = answer;
            scrollDown();
          }
        } catch {}
      }
    }

    if (!answer) {
      throw new Error("The AI returned an empty response.");
    }

    activeChat.messages.push({
      role:"assistant",
      content:answer
    });

  } catch (error) {
    document.getElementById("typing")?.remove();

    const errorText =
      "⚠️ " + error.message +
      "\n\nPlease try again later.";

    addMessageElement("assistant",errorText);

    activeChat.messages.push({
      role:"assistant",
      content:errorText
    });

  } finally {
    setBusy(false);
    renderHistory();
    scrollDown();
  }
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
}

function closeSidebar() {
  document.getElementById("sidebar").classList.remove("open");
}

promptBox.addEventListener("input",() => {
  promptBox.style.height = "45px";
  promptBox.style.height =
    Math.min(promptBox.scrollHeight,160) + "px";
});

promptBox.addEventListener("keydown",e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

newChat();
</script>

</body>
</html>
