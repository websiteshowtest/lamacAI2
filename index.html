
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#01C7FC">
  <title>lamacAI</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

  <style>
    :root {
      --accent: #01C7FC;
      --accent-dark: #009fc9;
      --bg: #f5f8fa;
      --surface: #ffffff;
      --text: #17212b;
      --muted: #77838e;
      --border: #e6edf1;
      --sidebar: #ffffff;
      --user: #e8f9ff;
      --shadow: 0 8px 30px rgba(20, 50, 70, .06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    button, textarea { font: inherit; }

    .app {
      height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 270px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      padding: 22px 15px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 8px 25px;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.7px;
    }

    .logo {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: white;
      background: linear-gradient(135deg, #01c7fc, #008dbb);
      font-size: 20px;
      box-shadow: 0 4px 12px #01c7fc55;
    }

    .new-chat {
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      padding: 13px;
      border-radius: 12px;
      text-align: left;
      cursor: pointer;
      font-weight: 650;
      transition: .2s;
    }

    .new-chat:hover {
      border-color: var(--accent);
      background: #f1fbff;
    }

    .section-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 1px;
      padding: 25px 9px 10px;
      text-transform: uppercase;
    }

    .chat-list {
      overflow-y: auto;
      flex: 1;
    }

    .chat-item {
      width: 100%;
      padding: 11px 12px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      text-align: left;
      color: var(--text);
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 3px;
      font-size: 13px;
    }

    .chat-item:hover, .chat-item.active {
      background: #edf9fd;
    }

    .sidebar-bottom {
      border-top: 1px solid var(--border);
      padding: 15px 8px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .topbar {
      height: 66px;
      background: rgba(255,255,255,.85);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      flex-shrink: 0;
    }

    .top-title {
      font-weight: 750;
      font-size: 15px;
    }

    .model-label {
      font-size: 12px;
      color: #008dbb;
      background: #e7faff;
      padding: 7px 11px;
      border-radius: 20px;
      font-weight: 700;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 35px 20px;
      scroll-behavior: smooth;
    }

    .message-area {
      max-width: 820px;
      margin: 0 auto;
    }

    .welcome {
      text-align: center;
      padding: 12vh 15px 30px;
    }

    .welcome-logo {
      width: 66px;
      height: 66px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      color: white;
      font-size: 34px;
      background: linear-gradient(135deg, #01c7fc, #008dbb);
      box-shadow: 0 8px 25px #01c7fc44;
    }

    .welcome h1 {
      font-size: clamp(27px, 5vw, 39px);
      margin: 0 0 12px;
      letter-spacing: -1.5px;
    }

    .welcome h1 span { color: var(--accent-dark); }

    .welcome p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      margin-top: 28px;
    }

    .suggestion {
      border: 1px solid var(--border);
      background: white;
      border-radius: 12px;
      padding: 11px 14px;
      cursor: pointer;
      color: #44515d;
      font-size: 13px;
      transition: .2s;
    }

    .suggestion:hover {
      border-color: var(--accent);
      color: #008dbb;
    }

    .message {
      display: flex;
      gap: 13px;
      margin: 25px 0;
      align-items: flex-start;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 13px;
    }

    .message.user .avatar {
      background: #e8edf1;
      color: #52616d;
    }

    .message.assistant .avatar {
      color: white;
      background: linear-gradient(135deg, #01c7fc, #008dbb);
    }

    .bubble {
      min-width: 0;
      max-width: 100%;
      line-height: 1.7;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .message.user .bubble {
      background: var(--user);
      border: 1px solid #d7f3fc;
      border-radius: 4px 14px 14px 14px;
      padding: 12px 16px;
    }

    .message.assistant .bubble {
      padding: 3px 2px;
      width: 100%;
    }

    .bubble p { margin: 0 0 12px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble h1, .bubble h2, .bubble h3 { line-height: 1.3; }
    .bubble pre {
      background: #17212b;
      color: #e8f5fa;
      padding: 16px;
      border-radius: 12px;
      overflow-x: auto;
    }
    .bubble code {
      background: #edf2f5;
      padding: 2px 5px;
      border-radius: 5px;
      font-size: .9em;
    }
    .bubble pre code {
      background: transparent;
      padding: 0;
    }
    .bubble a { color: #008dbb; }

    .typing {
      display: inline-flex;
      gap: 5px;
      padding: 8px 0;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-dark);
      animation: pulse 1s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }

    @keyframes pulse {
      0%, 60%, 100% { transform: translateY(0); opacity: .4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    .composer-wrap {
      padding: 15px 20px 18px;
      background: linear-gradient(transparent, var(--bg) 20%);
      flex-shrink: 0;
    }

    .composer {
      max-width: 820px;
      margin: 0 auto;
      background: white;
      border: 1px solid #dce6eb;
      border-radius: 17px;
      box-shadow: var(--shadow);
      padding: 12px 13px 10px;
      transition: border .2s;
    }

    .composer:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px #01c7fc18, var(--shadow);
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 48px;
      max-height: 180px;
      resize: none;
      border: 0;
      outline: 0;
      padding: 5px 4px;
      color: var(--text);
      background: transparent;
      font-size: 14px;
      line-height: 1.5;
    }

    textarea::placeholder { color: #9aa6af; }

    .composer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 7px;
    }

    .hint {
      color: #9aa6af;
      font-size: 11px;
    }

    .send {
      border: 0;
      width: 39px;
      height: 39px;
      border-radius: 12px;
      color: white;
      background: var(--accent);
      cursor: pointer;
      font-size: 19px;
      transition: .2s;
    }

    .send:hover { background: var(--accent-dark); }
    .send:disabled { opacity: .45; cursor: not-allowed; }

    .stop {
      display: none;
      border: 1px solid var(--border);
      background: white;
      color: #d34d4d;
      padding: 8px 12px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 12px;
    }

    .disclaimer {
      text-align: center;
      color: #9aa6af;
      font-size: 10px;
      padding-top: 10px;
    }

    .error {
      color: #b33c3c;
      background: #fff0f0;
      border: 1px solid #ffdada;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-top: 10px;
    }

    .mobile-menu {
      display: none;
      border: 0;
      background: transparent;
      font-size: 22px;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .sidebar {
        position: fixed;
        left: -280px;
        top: 0;
        bottom: 0;
        transition: left .2s;
        box-shadow: var(--shadow);
      }
      .sidebar.open { left: 0; }
      .mobile-menu { display: block; }
      .topbar { padding: 0 15px; }
      .messages { padding: 20px 14px; }
      .composer-wrap { padding: 10px 12px 14px; }
      .welcome { padding-top: 9vh; }
      .hint { display: none; }
    }
  </style>
</head>

<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">✦</div>
      lamacAI
    </div>

    <button class="new-chat" id="newChat">＋ &nbsp; Neuer Chat</button>

    <div class="section-label">Deine Chats</div>
    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-bottom">
      <strong>lamacAI</strong><br>
      KI-Assistent · Version 1.0<br>
      © 2026 lamacHub
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="mobile-menu" id="mobileMenu">☰</button>
        <div class="top-title">KI-Assistent</div>
      </div>
      <div class="model-label">✦ Auto Smart</div>
    </header>

    <section class="messages" id="messages">
      <div class="message-area" id="messageArea"></div>
    </section>

    <div class="composer-wrap">
      <form class="composer" id="chatForm">
        <textarea id="prompt" placeholder="Schreibe eine Nachricht an lamacAI ..."
          rows="1"></textarea>
        <div class="composer-bottom">
          <div class="hint">Enter zum Senden · Shift + Enter für neue Zeile</div>
          <div style="display:flex;gap:8px;align-items:center">
            <button type="button" class="stop" id="stopButton">Stopp</button>
            <button class="send" id="sendButton" type="submit">↑</button>
          </div>
        </div>
      </form>
      <div class="disclaimer">
        KI-Antworten können Fehler enthalten. Bitte überprüfe wichtige Informationen.
      </div>
    </div>
  </main>
</div>

<script>
  const API_URL = "https://api.llmfaucet.dev/v1/chat/completions";
  const MODEL = "auto:smart";

  const STORAGE_KEY = "lamacAI_chats_v1";

  const messageArea = document.getElementById("messageArea");
  const messagesBox = document.getElementById("messages");
  const promptInput = document.getElementById("prompt");
  const chatForm = document.getElementById("chatForm");
  const sendButton = document.getElementById("sendButton");
  const stopButton = document.getElementById("stopButton");
  const chatList = document.getElementById("chatList");

  let chats = loadChats();
  let currentChatId = null;
  let controller = null;
  let busy = false;

  function loadChats() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
      return [];
    }
  }

  function saveChats() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
  }

  function createChat() {
    const chat = {
      id: crypto.randomUUID(),
      title: "Neuer Chat",
      messages: [],
      created: Date.now()
    };

    chats.unshift(chat);
    currentChatId = chat.id;
    saveChats();
    renderChatList();
    renderMessages();
    closeMobileSidebar();
  }

  function getCurrentChat() {
    return chats.find(chat => chat.id === currentChatId);
  }

  function renderChatList() {
    chatList.innerHTML = "";

    chats.forEach(chat => {
      const button = document.createElement("button");
      button.className = "chat-item" +
        (chat.id === currentChatId ? " active" : "");
      button.textContent = "▢  " + chat.title;
      button.title = chat.title;

      button.addEventListener("click", () => {
        if (busy) return;
        currentChatId = chat.id;
        renderChatList();
        renderMessages();
        closeMobileSidebar();
      });

      chatList.appendChild(button);
    });
  }

  function renderMessages() {
    const chat = getCurrentChat();
    messageArea.innerHTML = "";

    if (!chat || chat.messages.length === 0) {
      showWelcome();
      return;
    }

    chat.messages.forEach(message => {
      addMessageToDOM(message.role, message.content);
    });

    scrollToBottom();
  }

  function showWelcome() {
    messageArea.innerHTML = `
      <div class="welcome">
        <div class="welcome-logo">✦</div>
        <h1>Hallo! Ich bin <span>lamacAI.</span></h1>
        <p>Was möchtest du heute wissen oder erstellen?</p>
        <div class="suggestions">
          <button class="suggestion" data-prompt="Erkläre mir Quantencomputer einfach.">
            💡 Etwas lernen
          </button>
          <button class="suggestion" data-prompt="Gib mir eine kreative Minecraft-Mod-Idee.">
            ⛏️ Minecraft-Idee
          </button>
          <button class="suggestion" data-prompt="Hilf mir, einen Java-Code zu schreiben.">
            💻 Programmieren
          </button>
        </div>
      </div>`;

    messageArea.querySelectorAll(".suggestion").forEach(button => {
      button.addEventListener("click", () => {
        promptInput.value = button.dataset.prompt;
        promptInput.focus();
        autoResize();
      });
    });
  }

  function addMessageToDOM(role, content, isLive = false) {
    const wrapper = document.createElement("div");
    wrapper.className = "message " + role;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "Du" : "✦";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if (isLive) {
      bubble.textContent = content;
    } else if (role === "assistant") {
      renderMarkdown(bubble, content);
    } else {
      bubble.textContent = content;
    }

    wrapper.appendChild(avatar);
    wrapper.appendChild(bubble);
    messageArea.appendChild(wrapper);

    scrollToBottom();
    return bubble;
  }

  function renderMarkdown(element, content) {
    if (window.marked && window.DOMPurify) {
      const html = marked.parse(content);
      element.innerHTML = DOMPurify.sanitize(html);
    } else {
      element.textContent = content;
    }
  }

  function scrollToBottom() {
    messagesBox.scrollTop = messagesBox.scrollHeight;
  }

  function autoResize() {
    promptInput.style.height = "auto";
    promptInput.style.height =
      Math.min(promptInput.scrollHeight, 180) + "px";
  }

  promptInput.addEventListener("input", autoResize);

  promptInput.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      chatForm.requestSubmit();
    }
  });

  function setBusy(value) {
    busy = value;
    sendButton.disabled = value;
    stopButton.style.display = value ? "block" : "none";
    sendButton.textContent = value ? "…" : "↑";
  }

  async function sendMessage(text) {
    if (busy || !text.trim()) return;

    if (!currentChatId) createChat();

    const chat = getCurrentChat();
    if (!chat) return;

    const userMessage = {
      role: "user",
      content: text.trim()
    };

    chat.messages.push(userMessage);

    if (chat.title === "Neuer Chat") {
      chat.title = text.trim().slice(0, 35) +
        (text.trim().length > 35 ? "…" : "");
    }

    saveChats();
    renderChatList();

    if (chat.messages.length === 1) {
      messageArea.innerHTML = "";
    }

    addMessageToDOM("user", userMessage.content);

    promptInput.value = "";
    autoResize();

    const assistantBubble = addMessageToDOM("assistant", "", true);
    const typing = document.createElement("div");
    typing.className = "typing";
    typing.innerHTML = "<span></span><span></span><span></span>";
    assistantBubble.appendChild(typing);

    setBusy(true);
    controller = new AbortController();

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer free"
        },
        signal: controller.signal,
        body: JSON.stringify({
          model: MODEL,
          stream: true,
          messages: [
            {
              role: "system",
              content:
                "Du bist lamacAI, ein hilfreicher, freundlicher KI-Assistent. " +
                "Antworte standardmäßig auf Deutsch. Erkläre verständlich, " +
                "sei ehrlich bei Unsicherheit und erfinde keine Fakten."
            },
            ...chat.messages
          ]
        })
      });

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(
          "Serverfehler " + response.status + ": " +
          errorText.slice(0, 350)
        );
      }

      if (!response.body) {
        throw new Error("Dieser Browser unterstützt den Livestream nicht.");
      }

      typing.remove();

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let fullText = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split("\n");
        buffer = lines.pop() || "";

        for (const line of lines) {
          const trimmed = line.trim();

          if (!trimmed.startsWith("data:")) continue;

          const data = trimmed.slice(5).trim();

          if (data === "[DONE]") continue;

          try {
            const json = JSON.parse(data);
            const piece = json.choices?.[0]?.delta?.content;

            if (typeof piece === "string" && piece.length > 0) {
              fullText += piece;
              assistantBubble.textContent = fullText;
              scrollToBottom();
            }
          } catch {
            // Unvollständige oder nicht relevante Stream-Zeile ignorieren.
          }
        }
      }

      if (!fullText.trim()) {
        throw new Error("Die KI hat keine Antwort geliefert.");
      }

      chat.messages.push({
        role: "assistant",
        content: fullText
      });

      renderMarkdown(assistantBubble, fullText);
      saveChats();

    } catch (error) {
      typing.remove();

      if (error.name === "AbortError") {
        if (assistantBubble.textContent.trim()) {
          chat.messages.push({
            role: "assistant",
            content: assistantBubble.textContent
          });
          saveChats();
        } else {
          assistantBubble.textContent = "Antwort abgebrochen.";
        }
      } else {
        assistantBubble.innerHTML = "";
        const errorBox = document.createElement("div");
        errorBox.className = "error";
        errorBox.textContent =
          "Die Verbindung zur KI ist fehlgeschlagen: " +
          error.message +
          " Bitte versuche es später erneut.";
        assistantBubble.appendChild(errorBox);
      }
    } finally {
      controller = null;
      setBusy(false);
      renderChatList();
      scrollToBottom();
    }
  }

  chatForm.addEventListener("submit", event => {
    event.preventDefault();
    sendMessage(promptInput.value);
  });

  stopButton.addEventListener("click", () => {
    if (controller) controller.abort();
  });

  document.getElementById("newChat").addEventListener("click", () => {
    if (!busy) createChat();
  });

  document.getElementById("mobileMenu").addEventListener("click", () => {
    document.getElementById("sidebar").classList.toggle("open");
  });

  function closeMobileSidebar() {
    document.getElementById("sidebar").classList.remove("open");
  }

  // Beim Start den letzten Chat öffnen.
  if (chats.length > 0) {
    currentChatId = chats[0].id;
    renderChatList();
    renderMessages();
  } else {
    createChat();
  }
</script>
</body>
</html>
